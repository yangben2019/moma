networks:
  local:
    name: moma_devcontainer

services:
  moma:
    container_name: moma_devcontainer
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              device_ids: [ nvidia.com/gpu=all ]
    environment:
      - DISPLAY=${DISPLAY}
    image: ghcr.io/aarhus-robotics/moma:devel
    runtime: nvidia
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ../../:/home/robot/workspace
      #- venv:/home/robot/.cache/pypoetry/virtualenvs
      - /tmp/.X11-unix:/tmp/.X11-unix

volumes:
  venv:
    name:
      moma_devcontainer_virtualenv